groups:
  - name: orders-service-slo
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[1m]))
            / sum(rate(http_requests_total[1m])) > 0.05
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "5xx error ratio above 5% (SLO: 99% success)"
          runbook: "README.md#runbook-higherrorrate"

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.5
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "p95 latency above 500ms"
          runbook: "README.md#runbook-highp95latency"

      - alert: ServiceDown
        expr: up{job="orders-service"} == 0
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: "orders-service is not being scraped"
