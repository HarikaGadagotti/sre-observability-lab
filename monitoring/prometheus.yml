global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: orders-service
    static_configs:
      - targets: ["app:8000"]

  - job_name: orders-service-kubernetes
    static_configs:
      - targets: ["host.docker.internal:8001"]
